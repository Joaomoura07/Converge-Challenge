# Supabase e Langfuse rodam na nuvem (planos free) — subir os dois localmente
# consome muita banda/RAM, e a rede do evento é compartilhada.
#
#   docker compose up --build                 -> só a API
#   docker compose --profile n8n up --build   -> API + n8n (http://localhost:5678)
#   docker compose --profile local-db up      -> API + Postgres local (fallback offline)

services:
  api:
    build: .
    env_file: .env
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./src:/app/src
      - ./prompts:/app/prompts
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  # Orquestrador de canais (WhatsApp, e-mail, Slack...). Dentro do compose, a API é http://api:8000
  # Fluxo-ponte (1x): importar, publicar e reiniciar. Depois: POST http://localhost:5678/webhook/agente {"task": "..."}
  #   docker compose exec n8n n8n import:workflow --input=/workflows/agent-bridge.json
  #   docker compose exec n8n n8n publish:workflow --id=AgentBridge00001
  #   docker compose restart n8n
  n8n:
    image: n8nio/n8n:latest
    profiles: ["n8n"]
    ports:
      - "5678:5678"
    environment:
      GENERIC_TIMEZONE: America/Recife
      TZ: America/Recife
      N8N_DIAGNOSTICS_ENABLED: "false"
      N8N_SECURE_COOKIE: "false"
    volumes:
      - n8n_data:/home/node/.n8n
      - ./n8n:/workflows:ro
    depends_on:
      - api

  postgres:
    image: postgres:16-alpine
    profiles: ["local-db"]
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: agents
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./sql:/docker-entrypoint-initdb.d:ro

volumes:
  pgdata:
  n8n_data:
